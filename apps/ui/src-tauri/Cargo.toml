[package]
name = "openscad-studio"
version = "1.4.0"
description = "Modern OpenSCAD editor with AI assistance"
authors = ["OpenSCAD Studio Contributors"]
edition = "2021"
license = "GPL-2.0"

[lib]
name = "openscad_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = { version = "2", features = ["watch"] }
tauri-plugin-process = "2"
keyring = { version = "=3.6.3", features = ["apple-native", "windows-native", "sync-secret-service"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
sha2 = "0.10"
base64 = "0.22"
url = "2"
diffy = "0.4"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
similar = "2"
rmcp = { version = "1", features = ["server", "transport-streamable-http-server"] }
tokio = { version = "1", features = ["net", "sync", "time", "rt", "rt-multi-thread", "macros"] }
tokio-util = { version = "0.7" }
axum = "0.8"
schemars = "0.8"
futures = "0.3"

# Opt-in HTTPS hosting of the standalone browser app.
axum-server = { version = "0.7", features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rcgen = { version = "0.13", features = ["x509-parser"] }
local-ip-address = "0.6"
tower-http = { version = "0.6", features = ["fs", "set-header"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
